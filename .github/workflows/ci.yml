name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app and remote API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dev tools
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip websocket-client

      - name: Verify Chrome is available
        run: |
          google-chrome --version || google-chrome-stable --version

      - name: Check JavaScript syntax
        run: |
          find js functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript lint
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Python test syntax
        run: python -m py_compile test_api_structure.py test_auth_gateway.py test_headless.py test_cdp.py test_cdp_migration.py test_file_protocol.py test_write_patches.py test_write_after_refresh.py test_online_write_response_contract.py test_action_pending_guard.py test_meals_optimistic.py test_housekeeping_optimistic.py test_reservation_status_optimistic.py test_event_members_optimistic.py test_rooming_write_patches.py test_rooming_online_journey.py test_online_query_boundaries.py test_view_read_modules.py test_rc_parity.py test_public_reservations.py test_public_reserve_cdp.py test_public_reservation_rate_limit.py test_public_reservation_sync_cdp.py test_online_no_sql.py test_online_query_guard.py test_perf_marks.py test_phase_g_cdp.py test_phase_g_fast_paths.py test_prod_latency.py test_p1_ops.py

      - name: Verify online API structure
        run: python test_api_structure.py

      - name: Auth SQL gateway checks
        run: python test_auth_gateway.py

      - name: Write patch contract
        run: python test_write_patches.py

      - name: Online write response contract
        run: python test_online_write_response_contract.py

      - name: Action pending guard
        run: python test_action_pending_guard.py

      - name: Optimistic UI contracts
        run: |
          python test_meals_optimistic.py
          python test_housekeeping_optimistic.py
          python test_reservation_status_optimistic.py
          python test_event_members_optimistic.py

      - name: Rooming write patches
        run: python test_rooming_write_patches.py

      - name: Rooming online journey
        run: python test_rooming_online_journey.py

      - name: Online query boundaries
        run: python test_online_query_boundaries.py

      - name: View read modules
        run: python test_view_read_modules.py

      - name: Read cache parity
        run: python test_rc_parity.py

      - name: Public reservation contracts (Phase E)
        run: |
          python test_public_reservations.py
          python test_public_reserve_cdp.py
          python test_public_reservation_rate_limit.py
          python test_public_reservation_sync_cdp.py

      - name: Instant post-write refresh (online)
        run: python test_write_after_refresh.py

      - name: Online mode no sql-wasm (Phase F)
        run: |
          python test_online_no_sql.py
          python test_online_query_guard.py

      - name: Performance mark contracts (Phase G)
        run: |
          python test_perf_marks.py
          python test_phase_g_fast_paths.py
          python test_p1_ops.py

      - name: Headless initialization smoke test
        run: python test_headless.py

      - name: CDP full journey smoke test
        run: python test_cdp.py

      - name: File protocol initialization smoke test
        run: python test_file_protocol.py

  migration:
    name: Local DB migration (force sql.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      KETANG_FORCE_LOCAL_DB: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip websocket-client

      - name: Verify Chrome is available
        run: |
          google-chrome --version || google-chrome-stable --version

      - name: Migration regression test
        run: python test_cdp_migration.py

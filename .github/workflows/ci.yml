name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate app and remote API
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install JavaScript dev tools
        run: npm ci

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip websocket-client

      - name: Verify Chrome is available
        run: |
          google-chrome --version || google-chrome-stable --version

      - name: Check JavaScript syntax
        run: |
          find js functions -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Run JavaScript lint
        run: npm run lint:ci

      - name: Check formatting
        run: npm run format:check

      - name: Check Python test syntax
        run: python -m py_compile test_api_structure.py test_auth_gateway.py test_headless.py test_cdp.py test_cdp_migration.py test_file_protocol.py

      - name: Verify online API structure
        run: python test_api_structure.py

      - name: Auth SQL gateway checks
        run: python test_auth_gateway.py

      - name: Headless initialization smoke test
        run: python test_headless.py

      - name: CDP full journey smoke test
        run: python test_cdp.py

      - name: File protocol initialization smoke test
        run: python test_file_protocol.py

      - name: Migration regression test
        run: python test_cdp_migration.py

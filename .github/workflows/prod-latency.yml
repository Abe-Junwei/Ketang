name: Production latency

on:
  schedule:
    # 每周一 02:00 UTC（北京时间 10:00）| Weekly latency patrol
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      base_url:
        description: "Site base URL (Pages preview if main has Access)"
        required: false
        default: "https://wulingkt.net"
      samples:
        description: "Sample count for P50/P95"
        required: false
        default: "7"

permissions:
  contents: read

jobs:
  latency:
    name: API latency vs baseline
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run production latency probe
        env:
          LATENCY_BASE: ${{ github.event.inputs.base_url || secrets.KETANG_LATENCY_BASE || 'https://wulingkt.net' }}
        run: |
          set +e
          python test_prod_latency.py \
            --base "$LATENCY_BASE" \
            --samples "${{ github.event.inputs.samples || '7' }}" \
            --write-report /tmp/ketang-latency-report.json \
            --probe-frontend \
            --frontend-base "$LATENCY_BASE" \
            --check-baseline docs/ops/performance-baseline.json \
            --check-phase-g
          code=$?
          if [ "$code" != "0" ]; then
            echo "::warning::Latency probe exceeded baseline or phase G targets (see artifact)"
          fi
          exit 0

      - name: Upload latency report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ketang-latency-report
          path: /tmp/ketang-latency-report.json
          if-no-files-found: ignore

  frontend-perf:
    name: Frontend login-ready (CDP)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python test dependency
        run: python -m pip install --upgrade pip websocket-client

      - name: Verify Chrome is available
        run: |
          google-chrome --version || google-chrome-stable --version

      - name: Phase G login-ready CDP probe
        run: python test_phase_g_cdp.py
